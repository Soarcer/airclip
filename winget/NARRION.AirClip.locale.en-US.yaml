ShortDescription: LAN-only, end-to-end encrypted clipboard bridge between iPhone and Windows.
Description: |-
  AirClip moves text and URLs between an iPhone and a Windows PC over your local
  network. Copy on the iPhone, press the Action Button, and it is on the PC clipboard
  in under a second; pull the PC's recent clips from the AirClip keyboard inside any
  text field.

  No account, no cloud, no relay server. Devices pair once by scanning a QR code and
  confirming four emoji, then talk directly over your Wi-Fi with ChaCha20-Poly1305
  encryption. Nothing ever leaves your network — verifiable with a packet capture.
