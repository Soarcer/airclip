[package]
name = "airclip-core"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[features]
default = []
mdns = ["dep:mdns-sd"]      # Windows agent enables; iOS uses NWBrowser via FFI hints
ffi = ["dep:uniffi"]        # iOS bindings build enables

[dependencies]
tokio.workspace = true
tokio-util.workspace = true
bytes.workspace = true
serde.workspace = true
ciborium.workspace = true
thiserror.workspace = true
tracing.workspace = true
hex.workspace = true
base64.workspace = true
url.workspace = true

# T-02 activated these; see workspace Cargo.toml for the obsolete-pin note.
x25519-dalek.workspace = true
chacha20poly1305.workspace = true
blake3.workspace = true
hkdf.workspace = true
sha2.workspace = true
getrandom.workspace = true
zeroize.workspace = true

mdns-sd = { version = "0.20", optional = true }
uniffi = { version = "0.32", optional = true }

[dev-dependencies]
tokio = { version = "1.53", features = ["full", "test-util"] }
futures-util = { version = "0.3", features = ["sink"] }
proptest = "1.11"
serde_json = "1.0"   # PairingRecord is stored as JSON by the platform keystores
