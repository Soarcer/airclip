[package]
name = "airclip-core"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[lib]
# staticlib is what xcodebuild bundles into AirClipCore.xcframework; lib keeps the
# crate usable from the Windows agent and the test harnesses.
crate-type = ["lib", "staticlib"]

[features]
default = []
mdns = ["dep:mdns-sd"]      # Windows agent enables; iOS uses NWBrowser via FFI hints
ffi = ["dep:uniffi", "dep:serde_json"]   # iOS bindings build enables

# Built only for the bindings pipeline; proc-macro UniFFI reads metadata out of this
# same crate, so the generator cannot be a standalone tool.
[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"
required-features = ["ffi"]

[dependencies]
tokio.workspace = true
tokio-util.workspace = true
bytes.workspace = true
serde.workspace = true
ciborium.workspace = true
thiserror.workspace = true
tracing.workspace = true
futures-util = { version = "0.3", features = ["sink"] }
hex.workspace = true
base64.workspace = true
url.workspace = true

# T-02 activated these; see workspace Cargo.toml for the obsolete-pin note.
x25519-dalek.workspace = true
chacha20poly1305.workspace = true
blake3.workspace = true
hkdf.workspace = true
sha2.workspace = true
getrandom.workspace = true
zeroize.workspace = true

mdns-sd = { version = "0.20", optional = true }
uniffi = { version = "0.32", optional = true, features = ["cli"] }
# Only the FFI layer serialises pairing records (the Keychain stores them as JSON);
# the Windows agent does its own serialisation behind DPAPI.
serde_json = { version = "1.0", optional = true }

[dev-dependencies]
tokio = { version = "1.53", features = ["full", "test-util"] }
futures-util = { version = "0.3", features = ["sink"] }
proptest = "1.11"
serde_json = "1.0"   # PairingRecord is stored as JSON by the platform keystores
