# XcodeGen spec — the Xcode project is generated, never hand-edited.
#
# This exists because the maintainer develops on Windows and has no Mac: creating targets,
# App Groups and entitlements through the Xcode GUI would be the one step that cannot be
# done from here. It also removes project.pbxproj from version control, which is the usual
# source of unmergeable conflicts.
#
#   brew install xcodegen && cd apps/ios && xcodegen generate
#
# Extension targets (AirClipSendIntent, AirClipKeyboard, AirClipShare) are added by
# T-08/T-09 — declaring them before their sources exist would break the build.

name: AirClip
options:
  bundleIdPrefix: com.narrion
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: false

settings:
  base:
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.9"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_STRICT_CONCURRENCY: complete
    # Ship-blocking if wrong: standard AEAD qualifies for the export exemption, but the
    # annual self-classification report is still filed (IOS-PLATFORM-NOTES §7).
    OTHER_LDFLAGS: "$(inherited)"

packages: {}

targets:
  AirClip:
    type: application
    platform: iOS
    sources:
      - path: AirClip
      # Checked-in UniFFI output (ARCHITECTURE §2) so an Xcode build never runs Rust.
      - path: Generated
        excludes:
          - "*.modulemap"
          - "*.h"
    dependencies:
      # Static library: linked, never embedded. Embedding a static xcframework makes
      # the app fail App Store validation.
      - framework: AirClipCore.xcframework
        embed: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.narrion.airclip
        PRODUCT_NAME: AirClip
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        # The generated Swift does `import AirClipCoreFFI`, resolved from the
        # xcframework's bundled module.modulemap.
        SWIFT_INCLUDE_PATHS: "$(inherited)"
        CODE_SIGN_ENTITLEMENTS: AirClip/AirClip.entitlements
    info:
      path: AirClip/Info.plist
      properties:
        CFBundleDisplayName: AirClip
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        # Missing NSBonjourServices silently breaks discovery even when the usage
        # description is present (IOS-PLATFORM-NOTES §3).
        NSBonjourServices:
          - _airclip._tcp
        NSLocalNetworkUsageDescription:
          AirClip talks directly to your PC on this Wi-Fi network. Nothing is sent to the
          internet or to any server.
        NSCameraUsageDescription:
          AirClip uses the camera once, to scan the pairing code shown on your PC.
        ITSAppUsesNonExemptEncryption: false
